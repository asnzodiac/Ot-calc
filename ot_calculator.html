
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OT Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px #ccc;
      border-radius: 8px;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>OT Calculator</h2>

    <label for="grossSalary">Enter Gross Salary (₹):</label>
    <input type="number" id="grossSalary" placeholder="e.g. 30000" />

    <button onclick="calculateOT()">Calculate OT</button>

    <div class="result" id="otResult"></div>
  </div>

  <script>
    function calculateOT() {
      const x = parseFloat(document.getElementById('grossSalary').value);
      if (isNaN(x) || x <= 0) {
        document.getElementById('otResult').innerText = "Please enter a valid salary.";
        return;
      }

      const y = x / 30;
      const z = y / 8;
      const ot = z * 2;

      document.getElementById('otResult').innerText = `Calculated OT: ₹${ot.toFixed(2)}`;
    }
  </script>

</body>
</html>
